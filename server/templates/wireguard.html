{% extends "base.html" %}
{% block title %}VPN — Anchor{% endblock %}
{% block nav_vpn %}bg-gray-700 text-white font-medium{% endblock %}

{% block content %}
<div x-data="vpnPage()" x-init="init()">

  <!-- ============================================================ -->
  <!-- ADMIN VIEW                                                    -->
  <!-- ============================================================ -->
  <template x-if="isAdmin">
    <div class="space-y-4">

      <!-- Page header + summary stats -->
      <div class="flex items-center gap-3 flex-wrap">
        <h1 class="text-xl font-bold text-gray-800 mr-2">WireGuard VPN</h1>

        <span :class="wgStatus ? 'bg-green-100 text-green-700 border-green-200' : 'bg-gray-100 text-gray-500 border-gray-200'"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border">
          <span :class="wgStatus ? 'bg-green-500' : 'bg-gray-400'" class="w-1.5 h-1.5 rounded-full"></span>
          <span x-text="wgStatus ? 'Enabled' : 'Disabled'"></span>
        </span>

        <template x-if="livePeers.length > 0">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
            <span x-text="livePeers.filter(p => p.online).length" class="font-bold"></span>
            <span x-text="' / ' + livePeers.length + ' online'"></span>
          </span>
        </template>

        <template x-if="pool">
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-50 text-gray-600 border border-gray-200">
            <span class="text-gray-400">pool</span>
            <span x-text="pool.free + ' free / ' + pool.total"></span>
          </span>
        </template>

        <div class="flex-1"></div>

        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-400"
                x-show="peersRefreshedAt"
                x-text="'Updated ' + peersRefreshedAt"></span>
          <button @click="loadLivePeers()"
                  :disabled="peersLoading"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-gray-200 text-xs font-medium text-gray-600 hover:bg-gray-50 disabled:opacity-50">
            <span :class="peersLoading ? 'animate-spin' : ''" class="inline-block">↺</span>
            Refresh
          </button>
        </div>
      </div>

      <!-- ── Live Peers ───────────────────────────────────────────── -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
          <div class="flex items-center gap-2">
            <span class="text-base">📡</span>
            <span class="text-sm font-semibold text-gray-700">Live Peers</span>
            <span class="text-xs text-gray-400">auto-refresh 30 s</span>
          </div>
          <template x-if="peersLoading">
            <span class="text-xs text-gray-400 animate-pulse">Loading…</span>
          </template>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-400 uppercase tracking-wider">
              <tr>
                <th class="px-5 py-2.5 text-left">User</th>
                <th class="px-5 py-2.5 text-left">IP</th>
                <th class="px-5 py-2.5 text-left">Status</th>
                <th class="px-5 py-2.5 text-left">Endpoint</th>
                <th class="px-5 py-2.5 text-left">Handshake</th>
                <th class="px-5 py-2.5 text-right">↓ RX</th>
                <th class="px-5 py-2.5 text-right">↑ TX</th>
                <th class="px-5 py-2.5 text-left">Lease</th>
                <th class="px-5 py-2.5"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              <template x-if="livePeers.length === 0 && !peersLoading">
                <tr>
                  <td colspan="9" class="px-5 py-8 text-center text-gray-400 text-sm">
                    <template x-if="wgStatus">
                      <span>No peers registered</span>
                    </template>
                    <template x-if="!wgStatus">
                      <span>WireGuard not enabled — configure the sidecar below</span>
                    </template>
                  </td>
                </tr>
              </template>
              <template x-for="p in livePeers" :key="p.public_key">
                <tr class="hover:bg-gray-50/50 transition-colors">
                  <!-- User -->
                  <td class="px-5 py-3 font-medium text-gray-800">
                    <span x-text="p.name || '—'"></span>
                  </td>
                  <!-- IP (strip /32) -->
                  <td class="px-5 py-3 font-mono text-xs text-gray-600"
                      x-text="(p.allowed_ips || '').replace('/32','')"></td>
                  <!-- Online status -->
                  <td class="px-5 py-3">
                    <template x-if="p.online">
                      <span class="inline-flex items-center gap-1.5 text-xs font-medium text-green-700">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Online
                      </span>
                    </template>
                    <template x-if="!p.online && p.age_seconds !== null">
                      <span class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-400">
                        <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                        Offline
                      </span>
                    </template>
                    <template x-if="!p.online && p.age_seconds === null">
                      <span class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-300">
                        <span class="w-2 h-2 rounded-full bg-gray-200"></span>
                        Never
                      </span>
                    </template>
                  </td>
                  <!-- Endpoint -->
                  <td class="px-5 py-3 font-mono text-xs text-gray-500"
                      x-text="p.endpoint || '—'"></td>
                  <!-- Handshake age -->
                  <td class="px-5 py-3 text-xs text-gray-500"
                      x-text="fmtAge(p.age_seconds)"></td>
                  <!-- RX -->
                  <td class="px-5 py-3 text-xs text-right font-mono text-gray-500"
                      x-text="fmtBytes(p.transfer_rx)"></td>
                  <!-- TX -->
                  <td class="px-5 py-3 text-xs text-right font-mono text-gray-500"
                      x-text="fmtBytes(p.transfer_tx)"></td>
                  <!-- Lease state -->
                  <td class="px-5 py-3">
                    <template x-if="p.state === 'active'">
                      <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700"
                            x-text="'active' + (p.expires_at ? ' · ' + fmtExpiry(p.expires_at) : '')"></span>
                    </template>
                    <template x-if="p.state === 'onboarding'">
                      <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">onboarding</span>
                    </template>
                    <template x-if="!p.state">
                      <span class="text-xs text-gray-300">—</span>
                    </template>
                  </td>
                  <!-- Actions -->
                  <td class="px-5 py-3 text-right">
                    <template x-if="p.name">
                      <button @click="revokeAdmin(p.name)"
                              class="text-xs text-red-500 hover:text-red-700 font-medium">
                        Revoke
                      </button>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ── Users & Leases (fusionado) ──────────────────────────── -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
          <div class="flex items-center gap-2">
            <span class="text-base">🔑</span>
            <span class="text-sm font-semibold text-gray-700">VPN Users</span>
            <span class="text-xs text-gray-400 ml-1">access &amp; lease management</span>
          </div>
          <button @click="loadVpnUsers(); loadLeases()"
                  class="text-xs text-blue-600 hover:text-blue-800">Refresh</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-400 uppercase tracking-wider">
              <tr>
                <th class="px-5 py-2.5 text-left">User</th>
                <th class="px-5 py-2.5 text-left">VPN UID</th>
                <th class="px-5 py-2.5 text-left">OTP</th>
                <th class="px-5 py-2.5 text-left">IP</th>
                <th class="px-5 py-2.5 text-left">State</th>
                <th class="px-5 py-2.5 text-left">Expires</th>
                <th class="px-5 py-2.5 text-left">Lease / Blackout</th>
                <th class="px-5 py-2.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              <template x-if="vpnUsers.length === 0">
                <tr>
                  <td colspan="8" class="px-5 py-6 text-center text-gray-400 text-sm">No users found</td>
                </tr>
              </template>
              <template x-for="u in vpnUsers" :key="u.username">
                <tr class="hover:bg-gray-50/50" x-data="{ get lease() { return leaseFor(u.username); } }">
                  <!-- User + groups -->
                  <td class="px-5 py-3">
                    <div class="font-medium text-gray-800" x-text="u.username"></div>
                    <div class="text-xs text-gray-400" x-text="u.groups.join(', ')"></div>
                  </td>
                  <!-- VPN UID -->
                  <td class="px-5 py-3">
                    <template x-if="u.vpn_uid">
                      <span class="font-mono text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded"
                            x-text="'UID ' + u.vpn_uid"></span>
                    </template>
                    <template x-if="!u.vpn_uid">
                      <span class="text-gray-300 text-xs">—</span>
                    </template>
                  </td>
                  <!-- OTP -->
                  <td class="px-5 py-3">
                    <template x-if="u.has_vpn_seed">
                      <span class="text-xs text-green-600 font-medium">✔</span>
                    </template>
                    <template x-if="!u.has_vpn_seed">
                      <span class="text-gray-300 text-xs">—</span>
                    </template>
                  </td>
                  <!-- IP from lease -->
                  <td class="px-5 py-3 font-mono text-xs text-gray-600"
                      x-text="lease ? lease.assigned_ip : '—'"></td>
                  <!-- Lease state -->
                  <td class="px-5 py-3">
                    <template x-if="lease && lease.state === 'active' && !lease.blackout_active">
                      <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700">active</span>
                    </template>
                    <template x-if="lease && lease.state === 'active' && lease.blackout_active">
                      <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">blackout</span>
                    </template>
                    <template x-if="lease && lease.state === 'onboarding'">
                      <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">onboarding</span>
                    </template>
                    <template x-if="!lease">
                      <span class="text-gray-300 text-xs">—</span>
                    </template>
                  </td>
                  <!-- Expires -->
                  <td class="px-5 py-3 text-xs text-gray-400"
                      x-text="lease ? fmtExpiry(lease.expires_at) : '—'"></td>
                  <!-- Lease duration + blackout summary -->
                  <td class="px-5 py-3">
                    <div class="flex flex-col gap-0.5">
                      <span class="text-xs text-gray-500"
                            x-text="fmtUserLease(u.vpn_lease_minutes)"></span>
                      <template x-if="u.vpn_blackout_start && u.vpn_blackout_end">
                        <span class="text-xs text-orange-500"
                              x-text="'🌙 ' + u.vpn_blackout_start + ' – ' + u.vpn_blackout_end + ' UTC'"></span>
                      </template>
                    </div>
                    <button @click="openSettingsModal(u)"
                            class="mt-1 text-xs text-blue-500 hover:text-blue-700">
                      Edit
                    </button>
                  </td>
                  <!-- Actions -->
                  <td class="px-5 py-3 text-right">
                    <div class="flex items-center justify-end gap-3">
                      <button @click="provisionUser(u.username)"
                              :disabled="provisioningUser === u.username"
                              class="text-xs text-blue-600 hover:text-blue-800 font-medium disabled:opacity-50"
                              x-text="u.has_vpn_seed ? 'Re-provision' : 'Provision'">
                      </button>
                      <template x-if="u.has_vpn_seed">
                        <button @click="revokeUserOtp(u.username)"
                                class="text-xs text-orange-500 hover:text-orange-700 font-medium">
                          Revoke OTP
                        </button>
                      </template>
                      <template x-if="lease">
                        <button @click="revokeAdmin(u.username)"
                                class="text-xs text-red-500 hover:text-red-700 font-medium">
                          Revoke Lease
                        </button>
                      </template>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ── Configuration (collapsible) ─────────────────────────── -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200">
        <button class="w-full flex items-center justify-between px-5 py-3.5 text-left"
                @click="cfgOpen = !cfgOpen">
          <div class="flex items-center gap-2">
            <span class="text-base">⚙️</span>
            <span class="text-sm font-semibold text-gray-700">Sidecar Configuration</span>
            <template x-if="cfgMeta.updated_at">
              <span class="text-xs text-gray-400"
                    x-text="'· last saved ' + cfgMeta.updated_at + (cfgMeta.created_by ? ' by ' + cfgMeta.created_by : '')"></span>
            </template>
          </div>
          <span class="text-gray-400 text-sm" x-text="cfgOpen ? '▲' : '▼'"></span>
        </button>

        <div x-show="cfgOpen" x-cloak class="px-5 pb-5 pt-1 space-y-4 border-t border-gray-100">

          <!-- Row 1: sidecar URL + api_key -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Sidecar URL</label>
              <input x-model="cfg.sidecar_url" type="text"
                     placeholder="http://localhost:8000"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              <p class="text-xs text-gray-400 mt-1">Use http://localhost:8000 with the merged compose.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">API Key</label>
              <input x-model="cfg.api_key" type="password"
                     placeholder="leave blank to keep current"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              <p class="text-xs text-gray-400 mt-1">Encrypted with AES-256-GCM at rest.</p>
            </div>
          </div>

          <!-- Row 2: subnet + server_endpoint -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">VPN Subnet (CIDR)</label>
              <input x-model="cfg.subnet" type="text"
                     placeholder="10.13.13.0/24"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              <p class="text-xs text-gray-400 mt-1">.0 (network), .1 (server) and .255 (broadcast) are reserved.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Server Endpoint <span class="text-red-400">*</span>
              </label>
              <div class="flex gap-2">
                <input x-model="endpointHost"
                       @input="cfg.server_endpoint = endpointHost + ':' + endpointPort"
                       type="text"
                       placeholder="1.2.3.4 or vpn.example.com"
                       class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                <input x-model.number="endpointPort"
                       @input="cfg.server_endpoint = endpointHost + ':' + endpointPort"
                       type="number" min="1" max="65535"
                       placeholder="51820"
                       class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              </div>
              <p class="text-xs text-gray-400 mt-1">Public IP/hostname and UDP port sent to clients.</p>
            </div>
          </div>

          <!-- Row 3: lease_hours + knock_port + enabled -->
          <div class="grid grid-cols-3 gap-4 items-end">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Default Lease (hours)
                <span class="text-gray-400 font-normal">(0 = infinite)</span>
              </label>
              <input x-model.number="cfg.lease_hours" type="number" min="0"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              <p class="text-xs text-gray-400 mt-1">Per-user overrides set in "VPN Users" table.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                SPA Knock Port
                <span class="text-gray-400 font-normal ml-1">(UDP, 0 = disabled)</span>
              </label>
              <input x-model.number="cfg.knock_port" type="number" min="0" max="65535"
                     placeholder="62201"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              <p class="text-xs text-gray-400 mt-1">Must match <code class="bg-gray-100 px-1 rounded">VPN_KNOCK_PORT</code>.</p>
            </div>
            <div class="pb-2">
              <label class="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" x-model="cfg.enabled" class="rounded" />
                <span class="text-sm text-gray-700">Enabled</span>
              </label>
            </div>
          </div>

          <!-- Row 4: Routed Networks + DNS (side by side) -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Routed Networks
                <span class="text-gray-400 font-normal ml-1">(one CIDR per line)</span>
              </label>
              <textarea x-model="cfg.routes_raw" rows="3"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0.0.0.0/0&#10;10.100.0.0/16"></textarea>
              <p class="text-xs text-gray-400 mt-1">AllowedIPs pushed to clients. Default: <code class="bg-gray-100 px-1 rounded">0.0.0.0/0</code>.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                DNS Servers
                <span class="text-gray-400 font-normal ml-1">(one per line, optional)</span>
              </label>
              <textarea x-model="cfg.dns_raw" rows="3"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="1.1.1.1&#10;8.8.8.8"></textarea>
              <p class="text-xs text-gray-400 mt-1">Leave empty to omit DNS from client configs.</p>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="flex items-center gap-3 pt-1">
            <button @click="saveCfg()"
                    :disabled="saving"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50">
              <span x-text="saving ? 'Saving…' : 'Save'"></span>
            </button>
            <button @click="testConn()"
                    :disabled="testing"
                    class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 disabled:opacity-50">
              <span x-text="testing ? 'Testing…' : 'Test connection'"></span>
            </button>
            <button @click="removeCfg()"
                    class="px-4 py-2 text-red-600 text-sm font-medium rounded-lg hover:bg-red-50">
              Remove config
            </button>
          </div>

          <!-- Save result -->
          <template x-if="saveMsg">
            <div :class="saveOk ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
                 class="border rounded-lg px-4 py-2 text-sm" x-text="saveMsg"></div>
          </template>

          <!-- Test result -->
          <template x-if="testResult">
            <div :class="testResult.ok ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'"
                 class="border rounded-lg px-4 py-3 text-sm">
              <div class="flex items-center gap-2 font-medium"
                   :class="testResult.ok ? 'text-green-700' : 'text-red-700'">
                <span x-text="testResult.ok ? '✔ Connected' : '✘ Failed'"></span>
                <span x-show="testResult.latency_ms != null" class="font-normal text-xs"
                      x-text="'(' + testResult.latency_ms + ' ms)'"></span>
              </div>
              <template x-if="testResult.error">
                <p class="mt-1 text-red-600 font-mono text-xs" x-text="testResult.error"></p>
              </template>
              <template x-if="testResult.ok && Object.keys(testResult.details || {}).length">
                <dl class="mt-2 space-y-0.5 text-gray-600">
                  <template x-for="[k, v] in Object.entries(testResult.details)" :key="k">
                    <div class="flex gap-2 text-xs">
                      <dt class="font-medium w-28 shrink-0" x-text="k"></dt>
                      <dd class="text-gray-500 font-mono" x-text="v"></dd>
                    </div>
                  </template>
                </dl>
              </template>
            </div>
          </template>

        </div>
      </div>

    </div>
  </template>

  <!-- ============================================================ -->
  <!-- PER-USER VPN SETTINGS MODAL                                   -->
  <!-- ============================================================ -->
  <template x-if="settingsModal">
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
         @click.self="settingsModal = null">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <div>
            <h3 class="text-base font-semibold text-gray-800">VPN settings</h3>
            <p class="text-xs text-gray-500 mt-0.5">
              User: <span class="font-medium text-gray-700" x-text="settingsModal.username"></span>
            </p>
          </div>
          <button @click="settingsModal = null" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
        </div>

        <div class="px-6 py-5 space-y-5">

          <!-- Lease duration -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-2">Lease duration</label>
            <div class="flex items-center gap-3">
              <select x-model="settingsModal.leaseMode"
                      class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="global">Global default</option>
                <option value="infinite">Infinite (never expires)</option>
                <option value="custom">Custom duration</option>
              </select>
              <template x-if="settingsModal.leaseMode === 'custom'">
                <div class="flex items-center gap-2">
                  <input x-model.number="settingsModal.leaseMinutes" type="number" min="1"
                         placeholder="60"
                         class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  <span class="text-xs text-gray-500">minutes</span>
                </div>
              </template>
            </div>
            <p class="text-xs text-gray-400 mt-1">
              "Global default" uses the <em>Lease Duration (hours)</em> setting from the sidecar config.
              Custom: 60 = 1 h, 480 = 8 h, 1440 = 1 day, etc.
            </p>
          </div>

          <!-- Blackout window -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-2">
              Blackout window
              <span class="text-gray-400 font-normal">(peer suspended, IP preserved)</span>
            </label>
            <label class="flex items-center gap-2 mb-3 cursor-pointer">
              <input type="checkbox" x-model="settingsModal.blackoutEnabled" class="rounded" />
              <span class="text-sm text-gray-700">Enable blackout window</span>
            </label>
            <template x-if="settingsModal.blackoutEnabled">
              <div class="space-y-3">
                <div class="flex items-center gap-3">
                  <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">Start (UTC)</label>
                    <input x-model="settingsModal.blackoutStart" type="time"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  </div>
                  <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">End (UTC)</label>
                    <input x-model="settingsModal.blackoutEnd" type="time"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  </div>
                </div>
                <p class="text-xs text-gray-400">
                  Cross-midnight ranges work (e.g. 20:00 → 08:00).
                  The janitor checks every 5 minutes.
                </p>
              </div>
            </template>
          </div>

          <!-- Save result -->
          <template x-if="settingsMsg">
            <div :class="settingsOk ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
                 class="border rounded-lg px-4 py-2 text-sm" x-text="settingsMsg"></div>
          </template>

        </div>

        <div class="px-6 pb-5 flex gap-3">
          <button @click="saveUserSettings()"
                  :disabled="settingsSaving"
                  class="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-50"
                  x-text="settingsSaving ? 'Saving…' : 'Save'">
          </button>
          <button @click="settingsModal = null"
                  class="py-2 px-4 rounded-lg bg-gray-100 text-gray-700 text-sm font-medium hover:bg-gray-200">
            Close
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- PROVISION TOKEN MODAL                                         -->
  <!-- ============================================================ -->
  <template x-if="provModal">
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
         @click.self="provModal = null">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <div>
            <h3 class="text-base font-semibold text-gray-800">Provision token</h3>
            <p class="text-xs text-gray-500 mt-0.5">
              For user <span class="font-medium text-gray-700" x-text="provModal.username"></span>
              <template x-if="provModal.vpn_uid">
                <span> — VPN UID <span class="font-mono" x-text="provModal.vpn_uid"></span></span>
              </template>
            </p>
          </div>
          <button @click="provModal = null" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
        </div>
        <div class="px-6 py-5 space-y-5">
          <div>
            <p class="text-xs font-medium text-gray-600 mb-2">
              1. Send this token to the user. They paste it into:
              <code class="bg-gray-100 px-1 rounded">anc vpn init &lt;token&gt;</code>
            </p>
            <div class="relative">
              <textarea x-text="provModal.token" readonly rows="4"
                class="w-full font-mono text-xs bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 resize-none focus:outline-none select-all"
                @click="$el.select()"></textarea>
              <button @click="copyToken(provModal.token)"
                      class="absolute top-2 right-2 text-xs px-2 py-1 rounded bg-white border border-gray-200 hover:bg-gray-100 text-gray-600"
                      x-text="tokenCopied ? '✔ Copied' : 'Copy'">
              </button>
            </div>
          </div>
          <div>
            <p class="text-xs font-medium text-gray-600 mb-2">
              2. Send this TOTP URL so they can add it to their authenticator app:
            </p>
            <div class="relative">
              <input type="text" :value="provModal.provisioning_url" readonly
                     class="w-full font-mono text-xs bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none"
                     @click="$el.select()" />
              <button @click="copyToken(provModal.provisioning_url)"
                      class="absolute top-1/2 -translate-y-1/2 right-2 text-xs px-2 py-1 rounded bg-white border border-gray-200 hover:bg-gray-100 text-gray-600"
                      x-text="tokenCopied ? '✔ Copied' : 'Copy'">
              </button>
            </div>
          </div>
          <p class="text-xs text-gray-400">
            The token contains the TOTP seed, VPN UID, server endpoint, knock port, and WireGuard keys.
            Valid until the OTP seed is revoked.
          </p>
        </div>
        <div class="px-6 pb-5">
          <button @click="provModal = null"
                  class="w-full py-2 rounded-lg bg-gray-100 text-gray-700 text-sm font-medium hover:bg-gray-200">
            Close
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- USER VIEW                                                     -->
  <!-- ============================================================ -->
  <template x-if="!isAdmin">
    <div class="max-w-lg space-y-4">

      <template x-if="userLease">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-3">
          <div class="flex items-center gap-2 text-green-700 font-semibold text-sm">
            <span class="w-2 h-2 rounded-full bg-green-500"></span>
            Active VPN Lease
          </div>
          <dl class="text-sm space-y-1.5">
            <div class="flex gap-3">
              <dt class="w-28 text-gray-500 shrink-0 text-xs">Assigned IP</dt>
              <dd class="font-mono text-gray-800 text-xs" x-text="userLease.assigned_ip"></dd>
            </div>
            <div class="flex gap-3">
              <dt class="w-28 text-gray-500 shrink-0 text-xs">Peer name</dt>
              <dd class="text-gray-700 text-xs" x-text="userLease.peer_name"></dd>
            </div>
            <div class="flex gap-3">
              <dt class="w-28 text-gray-500 shrink-0 text-xs">Expires at</dt>
              <dd class="text-gray-500 text-xs" x-text="userLease.expires_at"></dd>
            </div>
            <div class="flex gap-3">
              <dt class="w-28 text-gray-500 shrink-0 text-xs">Config secret</dt>
              <dd>
                <span class="font-mono text-xs text-purple-700 bg-purple-50 px-2 py-0.5 rounded"
                      x-text="userLease.vault_path"></span>
              </dd>
            </div>
          </dl>
          <div class="pt-2">
            <button @click="revokeOwn()"
                    class="px-4 py-2 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50">
              Revoke lease
            </button>
          </div>
        </div>
      </template>

      <template x-if="!userLease && !leaseLoading">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 text-center space-y-3">
          <p class="text-gray-500 text-sm">You have no active VPN lease.</p>
          <p class="text-xs text-gray-400">
            Ask an admin to provision your WireGuard peer, then run
            <code class="bg-gray-100 px-1 rounded">anc vpn init &lt;token&gt;</code> followed by
            <code class="bg-gray-100 px-1 rounded">anc vpn up</code>.
          </p>
        </div>
      </template>

      <template x-if="actionMsg">
        <div :class="actionOk ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
             class="border rounded-lg px-4 py-2 text-sm" x-text="actionMsg"></div>
      </template>

    </div>
  </template>

</div>
{% endblock %}

{% block scripts %}
<script>
function vpnPage() {
  return {
    isAdmin: false,

    // Admin state
    cfgOpen: false,
    wgStatus: null,
    endpointHost: '',
    endpointPort: 51820,
    cfg: {
      sidecar_url: '',
      api_key: '',
      subnet: '10.13.13.0/24',
      server_endpoint: '',
      lease_hours: 8,
      knock_port: 0,
      enabled: true,
      routes_raw: '',
      dns_raw: '',
    },
    cfgMeta: {},
    saving: false,
    saveMsg: null,
    saveOk: false,
    testing: false,
    testResult: null,

    pool: null,
    leases: [],
    vpnUsers: [],
    provisioningUser: null,
    provModal: null,
    tokenCopied: false,

    // Per-user VPN settings modal
    settingsModal: null,
    settingsSaving: false,
    settingsMsg: null,
    settingsOk: false,

    // Live peers
    livePeers: [],
    peersLoading: false,
    peersRefreshedAt: null,
    _peersTimer: null,

    // User state
    userLease: null,
    leaseLoading: true,
    actionMsg: null,
    actionOk: false,

    token() { return localStorage.getItem('anc_token') || ''; },

    async init() {
      try {
        this.isAdmin = JSON.parse(localStorage.getItem('anc_groups') || '[]').includes('admins');
      } catch { this.isAdmin = false; }

      if (this.isAdmin) {
        await Promise.all([
          this.loadCfg(),
          this.loadPool(),
          this.loadLeases(),
          this.loadVpnUsers(),
          this.loadLivePeers(),
        ]);
        this._peersTimer = setInterval(() => this.loadLivePeers(), 30_000);
      } else {
        await this.loadUserLease();
      }
    },

    // ── Formatters ───────────────────────────────────────────────

    fmtUserLease(vpn_lease_minutes) {
      if (vpn_lease_minutes === null || vpn_lease_minutes === undefined) return 'global default';
      if (vpn_lease_minutes === 0) return '∞ infinite';
      if (vpn_lease_minutes < 60) return vpn_lease_minutes + 'm';
      if (vpn_lease_minutes % 60 === 0) return (vpn_lease_minutes / 60) + 'h';
      return Math.floor(vpn_lease_minutes / 60) + 'h ' + (vpn_lease_minutes % 60) + 'm';
    },

    fmtBytes(n) {
      if (!n) return '0 B';
      const k = 1024, u = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(Math.max(n, 1)) / Math.log(k));
      return (n / Math.pow(k, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
    },

    fmtAge(secs) {
      if (secs === null || secs === undefined) return 'never';
      if (secs < 60) return secs + 's ago';
      if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
      if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
      return Math.floor(secs / 86400) + 'd ago';
    },

    fmtExpiry(iso) {
      if (iso === null || iso === undefined) return '∞';
      if (!iso) return '—';
      const diff = new Date(iso) - Date.now();
      if (diff < 0) return 'expired';
      if (diff < 3_600_000) return 'in ' + Math.floor(diff / 60_000) + 'm';
      if (diff < 86_400_000) return 'in ' + Math.floor(diff / 3_600_000) + 'h';
      return 'in ' + Math.floor(diff / 86_400_000) + 'd';
    },

    // ── Live peers ───────────────────────────────────────────────

    async loadLivePeers() {
      this.peersLoading = true;
      try {
        const res = await fetch('/vpn/admin/peers', {
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        if (res.ok) {
          this.livePeers = await res.json();
          this.peersRefreshedAt = new Date().toLocaleTimeString();
        }
      } catch { /* ignore */ } finally {
        this.peersLoading = false;
      }
    },

    // ── Admin: config ────────────────────────────────────────────

    async loadCfg() {
      const res = await fetch('/integrations/wireguard', {
        headers: { Authorization: 'Bearer ' + this.token() },
      });
      if (!res.ok) return;
      const data = await res.json();
      this.wgStatus = data.enabled;
      this.cfgMeta = {
        created_at: data.created_at,
        updated_at: data.updated_at,
        created_by: data.created_by,
      };
      if (data.config) {
        const loaded = { ...data.config };
        if (loaded.api_key === '***') loaded.api_key = '';
        loaded.routes_raw = (loaded.routes || ['0.0.0.0/0']).join('\n');
        loaded.dns_raw = (loaded.dns || []).join('\n');
        delete loaded.routes;
        delete loaded.dns;
        this.cfg = { ...this.cfg, ...loaded };
        const ep = this.cfg.server_endpoint || '';
        const colon = ep.lastIndexOf(':');
        if (colon !== -1) {
          this.endpointHost = ep.slice(0, colon);
          this.endpointPort = parseInt(ep.slice(colon + 1)) || 51820;
        } else {
          this.endpointHost = ep;
          this.endpointPort = 51820;
        }
      }
    },

    async saveCfg() {
      this.saving = true;
      this.saveMsg = null;
      this.testResult = null;
      try {
        const payload = { ...this.cfg };
        if (!payload.api_key) delete payload.api_key;
        payload.routes = (payload.routes_raw || '0.0.0.0/0')
          .split('\n').map(s => s.trim()).filter(Boolean);
        payload.dns = (payload.dns_raw || '')
          .split('\n').map(s => s.trim()).filter(Boolean);
        delete payload.routes_raw;
        delete payload.dns_raw;
        const res = await fetch('/integrations/wireguard', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token() },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        this.saveOk = res.ok;
        this.saveMsg = data.detail || (res.ok ? 'Saved.' : 'Save failed.');
        if (res.ok) await Promise.all([this.loadCfg(), this.loadPool()]);
      } catch (e) {
        this.saveOk = false;
        this.saveMsg = 'Network error: ' + e.message;
      } finally {
        this.saving = false;
      }
    },

    async testConn() {
      this.testing = true;
      this.testResult = null;
      this.saveMsg = null;
      try {
        const res = await fetch('/integrations/wireguard/test', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        this.testResult = await res.json();
      } catch (e) {
        this.testResult = { ok: false, error: 'Network error: ' + e.message };
      } finally {
        this.testing = false;
      }
    },

    async removeCfg() {
      if (!confirm('Remove WireGuard configuration? This will not revoke existing leases.')) return;
      const res = await fetch('/integrations/wireguard', {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + this.token() },
      });
      if (res.ok) {
        this.saveOk = true;
        this.saveMsg = 'Configuration removed.';
        this.cfgMeta = {};
        this.wgStatus = null;
      }
    },

    // ── Admin: pool ──────────────────────────────────────────────

    async loadPool() {
      try {
        const res = await fetch('/vpn/admin/pool', {
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        if (res.ok) this.pool = await res.json();
      } catch { /* ignore */ }
    },

    // ── Admin: leases ────────────────────────────────────────────

    async loadLeases() {
      try {
        const res = await fetch('/vpn/admin/leases', {
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        if (res.ok) this.leases = await res.json();
      } catch { /* ignore */ }
    },

    leaseFor(username) {
      return this.leases.find(l => l.uid === username) || null;
    },

    async revokeAdmin(uid) {
      if (!confirm(`Revoke VPN lease for '${uid}'?`)) return;
      await fetch('/vpn/admin/leases/' + encodeURIComponent(uid), {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + this.token() },
      });
      await Promise.all([this.loadLeases(), this.loadPool(), this.loadLivePeers(), this.loadVpnUsers()]);
    },

    // ── Admin: VPN users ─────────────────────────────────────────

    async loadVpnUsers() {
      try {
        const res = await fetch('/admin/users', {
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        if (res.ok) this.vpnUsers = await res.json();
      } catch { /* ignore */ }
    },

    async provisionUser(username) {
      this.provisioningUser = username;
      try {
        const res = await fetch('/vpn/admin/users/' + encodeURIComponent(username) + '/otp', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        const data = await res.json();
        if (res.ok) {
          this.provModal = {
            username,
            vpn_uid: data.vpn_uid,
            token: data.provision_token,
            provisioning_url: data.provisioning_url,
          };
          this.tokenCopied = false;
          await this.loadVpnUsers();
        } else {
          alert('Provisioning failed: ' + (data.detail || res.status));
        }
      } catch (e) {
        alert('Network error: ' + e.message);
      } finally {
        this.provisioningUser = null;
      }
    },

    async revokeUserOtp(username) {
      if (!confirm(`Revoke VPN OTP seed for '${username}'? They will not be able to connect until re-provisioned.`)) return;
      await fetch('/vpn/admin/users/' + encodeURIComponent(username) + '/otp', {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + this.token() },
      });
      await Promise.all([this.loadVpnUsers(), this.loadLeases(), this.loadLivePeers()]);
    },

    async copyToken(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.tokenCopied = true;
        setTimeout(() => { this.tokenCopied = false; }, 2000);
      } catch { /* user can select manually */ }
    },

    // ── Per-user VPN settings ────────────────────────────────────

    openSettingsModal(u) {
      const minutes = u.vpn_lease_minutes;
      let leaseMode = 'global';
      let leaseMinutes = 60;
      if (minutes === 0) { leaseMode = 'infinite'; }
      else if (minutes != null) { leaseMode = 'custom'; leaseMinutes = minutes; }

      this.settingsMsg = null;
      this.settingsOk = false;
      this.settingsModal = {
        username: u.username,
        leaseMode,
        leaseMinutes,
        blackoutEnabled: !!(u.vpn_blackout_start && u.vpn_blackout_end),
        blackoutStart: u.vpn_blackout_start || '20:00',
        blackoutEnd: u.vpn_blackout_end || '08:00',
      };
    },

    async saveUserSettings() {
      const m = this.settingsModal;
      this.settingsSaving = true;
      this.settingsMsg = null;

      let vpn_lease_minutes = null;
      if (m.leaseMode === 'infinite') vpn_lease_minutes = 0;
      else if (m.leaseMode === 'custom') vpn_lease_minutes = m.leaseMinutes;

      const payload = {
        vpn_lease_minutes,
        vpn_blackout_start: m.blackoutEnabled ? m.blackoutStart : null,
        vpn_blackout_end:   m.blackoutEnabled ? m.blackoutEnd   : null,
      };

      try {
        const res = await fetch(
          '/vpn/admin/users/' + encodeURIComponent(m.username) + '/settings',
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token() },
            body: JSON.stringify(payload),
          },
        );
        const data = await res.json();
        this.settingsOk = res.ok;
        this.settingsMsg = data.detail || (res.ok ? 'Saved.' : 'Failed.');
        if (res.ok) await Promise.all([this.loadVpnUsers(), this.loadLeases(), this.loadLivePeers()]);
      } catch (e) {
        this.settingsOk = false;
        this.settingsMsg = 'Network error: ' + e.message;
      } finally {
        this.settingsSaving = false;
      }
    },

    // ── User: own lease ──────────────────────────────────────────

    async loadUserLease() {
      this.leaseLoading = true;
      try {
        const res = await fetch('/vpn/status', {
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        this.userLease = res.ok ? await res.json() : null;
      } catch {
        this.userLease = null;
      } finally {
        this.leaseLoading = false;
      }
    },

    async revokeOwn() {
      if (!confirm('Revoke your VPN lease? You will be disconnected.')) return;
      try {
        const res = await fetch('/vpn/lease', {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + this.token() },
        });
        const data = await res.json();
        this.actionOk = res.ok;
        this.actionMsg = data.detail || (res.ok ? 'Lease revoked.' : 'Revoke failed.');
        if (res.ok) this.userLease = null;
      } catch (e) {
        this.actionOk = false;
        this.actionMsg = 'Network error: ' + e.message;
      }
    },
  };
}
</script>
{% endblock %}
