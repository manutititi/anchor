<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Login</title>
  <link rel="stylesheet" href="/static/anchor.css" />
  <script defer src="/static/alpine.min.js"></script>
</head>
<body style="background-color:#090d18;min-height:100vh;display:flex;align-items:center;justify-content:center;"
      x-data="loginForm()" x-init="init()">

  <div class="auth-card">
    <div style="margin-bottom:1.5rem;">
      <div style="font-size:1.75rem;font-weight:700;color:#e8f0ff;margin-bottom:.25rem;">⚓ Anchor</div>
      <div style="font-size:.8rem;color:var(--text-muted);">Sign in to continue</div>
    </div>

    <form @submit.prevent="login()">
      <div class="mb-4">
        <label style="display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:.35rem;">
          Username
        </label>
        <input x-model="username" type="text" required autofocus class="w-full" />
      </div>
      <div class="mb-5">
        <label style="display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:.35rem;">
          Password
        </label>
        <input x-model="password" type="password" required class="w-full" />
      </div>

      <div x-show="error" x-cloak
           style="margin-bottom:.75rem;font-size:.8rem;color:#f09090;background:rgba(224,79,79,.1);border:1px solid rgba(224,79,79,.2);border-radius:.375rem;padding:.5rem .75rem;"
           x-text="error"></div>

      <button type="submit" :disabled="loading"
              style="width:100%;background-color:var(--accent);color:#e8f0ff;font-weight:500;padding:.55rem 1rem;border-radius:.375rem;font-size:.875rem;transition:background-color .15s;cursor:pointer;"
              onmouseover="if(!this.disabled)this.style.backgroundColor='var(--accent-hover)'"
              onmouseout="this.style.backgroundColor='var(--accent)'"
              :style="loading ? 'opacity:.5;cursor:not-allowed;' : ''">
        <span x-show="!loading">Sign in</span>
        <span x-show="loading" x-cloak>Signing in…</span>
      </button>
    </form>
  </div>

  <script>
    function tokenIsExpired(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.exp * 1000 < Date.now();
      } catch { return true; }
    }

    function loginForm() {
      return {
        username: '',
        password: '',
        error: '',
        loading: false,
        async init() {
          const token = localStorage.getItem('anc_token');
          if (token) {
            if (!tokenIsExpired(token)) {
              window.location.href = '/ui/secrets';
              return;
            }
            localStorage.removeItem('anc_token');
            localStorage.removeItem('anc_user');
            localStorage.removeItem('anc_groups');
          }
          try {
            const res = await fetch('/admin/needs-setup');
            const data = await res.json();
            if (data.needs_setup) {
              window.location.href = '/ui/setup';
            }
          } catch { /* ignore */ }
        },
        async login() {
          this.loading = true;
          this.error = '';
          try {
            const res = await fetch('/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: this.username, password: this.password }),
            });
            if (!res.ok) {
              const data = await res.json();
              this.error = data.detail || 'Login failed';
              return;
            }
            const data = await res.json();
            localStorage.setItem('anc_token', data.access_token);
            localStorage.setItem('anc_user', this.username);
            try {
              const payload = JSON.parse(atob(data.access_token.split('.')[1]));
              localStorage.setItem('anc_groups', JSON.stringify(payload.groups || []));
            } catch { localStorage.setItem('anc_groups', '[]'); }
            window.location.href = '/ui/secrets';
          } catch {
            this.error = 'Network error — is the server reachable?';
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
