<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Anchor Vault{% endblock %}</title>
  <link rel="stylesheet" href="/static/anchor.css" />
  <script defer src="/static/alpine.min.js"></script>
</head>
<body class="app-body" x-data="appShell()" x-init="init()">

  <!-- Sidebar backdrop (mobile) -->
  <div class="sidebar-backdrop" :class="{'sidebar-open': sidebarOpen}"
       @click="sidebarOpen = false"></div>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="app-sidebar" :class="{'sidebar-open': sidebarOpen}">
      <div class="sidebar-brand">⚓ Anchor</div>

      <nav>
        <a href="/ui/anchors"
           class="{% block nav_anchors %}{% endblock %}">
          ⚓ Anchors
        </a>
        <a href="/ui/secrets"
           class="{% block nav_secrets %}{% endblock %}">
          🔑 Secrets
        </a>
        <template x-if="isAdmin">
          <a href="/ui/users"
             class="{% block nav_users %}{% endblock %}">
            👥 Users
          </a>
        </template>
        <template x-if="isAdmin">
          <a href="/ui/logs"
             class="{% block nav_logs %}{% endblock %}">
            📋 Logs
          </a>
        </template>
        <template x-if="isAdmin">
          <a href="/ui/integrations"
             class="{% block nav_integrations %}{% endblock %}">
            🔌 Integrations
          </a>
        </template>
        <a href="/ui/wireguard"
           class="{% block nav_vpn %}{% endblock %}">
          🔒 VPN
        </a>
      </nav>

      <div class="sidebar-footer">
        <div x-text="username" class="font-medium text-gray-200 truncate"></div>
        <div x-text="groups.join(', ')" class="truncate mt-0\.5 text-xs"></div>
        <div x-show="sessionExpiresSoon" x-cloak
             class="mt-2 px-2 py-1 bg-yellow-700 text-yellow-100 rounded text-xs">
          Session expires soon
        </div>
        <button @click="logout()"
                class="mt-2 text-red-400 hover:text-red-300 text-xs cursor-pointer">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="app-main" @click="sidebarOpen = false">

      <!-- Mobile top bar -->
      <div class="flex items-center gap-3 mb-4" style="display:none" id="mobile-bar">
        <button class="mobile-toggle" @click.stop="sidebarOpen = !sidebarOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="text-sm font-medium text-gray-600">⚓ Anchor</span>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    function tokenIsExpired(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.exp * 1000 < Date.now();
      } catch { return true; }
    }

    function clearSession() {
      localStorage.removeItem('anc_token');
      localStorage.removeItem('anc_user');
      localStorage.removeItem('anc_groups');
    }

    function appShell() {
      return {
        username: '',
        groups: [],
        isAdmin: false,
        sessionExpiresSoon: false,
        sidebarOpen: false,
        init() {
          const token = localStorage.getItem('anc_token');
          if (!token || tokenIsExpired(token)) {
            clearSession();
            window.location.href = '/ui/login';
            return;
          }
          this.username = localStorage.getItem('anc_user') || '';
          try {
            this.groups = JSON.parse(localStorage.getItem('anc_groups') || '[]');
          } catch { this.groups = []; }
          this.isAdmin = this.groups.includes('admins');
          this._startSessionWatcher();
          this._initMobileBar();
        },
        _initMobileBar() {
          const bar = document.getElementById('mobile-bar');
          const update = () => { if (bar) bar.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; };
          update();
          window.addEventListener('resize', update);
        },
        _startSessionWatcher() {
          setInterval(() => {
            const token = localStorage.getItem('anc_token');
            if (!token || tokenIsExpired(token)) {
              clearSession();
              window.location.href = '/ui/login';
              return;
            }
            try {
              const payload = JSON.parse(atob(token.split('.')[1]));
              this.sessionExpiresSoon = (payload.exp * 1000 - Date.now()) < 5 * 60 * 1000;
            } catch {}
          }, 60_000);
        },
        logout() {
          clearSession();
          window.location.href = '/ui/login';
        },
        token() { return localStorage.getItem('anc_token') || ''; },
      };
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
