<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Setup</title>
  <link rel="stylesheet" href="/static/anchor.css" />
  <script defer src="/static/alpine.min.js"></script>
</head>
<body style="background-color:#090d18;min-height:100vh;display:flex;align-items:center;justify-content:center;"
      x-data="setupForm()" x-init="init()">

  <div class="auth-card" style="max-width:26rem;">
    <div class="flex items-center gap-3 mb-2">
      <span style="font-size:1.75rem;">⚓</span>
      <div>
        <h1 style="margin:0;font-size:1.25rem;font-weight:700;color:#e8f0ff;">Anchor Vault</h1>
        <p style="margin:0;font-size:.8rem;color:var(--accent);">First-time setup</p>
      </div>
    </div>
    <p style="font-size:.8rem;color:var(--text-secondary);margin:.75rem 0 1.25rem;">
      No users exist yet. Create the first admin account to get started.
    </p>

    <!-- Setup already done -->
    <div x-show="alreadySetup" x-cloak style="text-align:center;padding:1rem 0;">
      <p style="color:#52d085;font-weight:500;margin-bottom:.75rem;">✓ Setup already complete.</p>
      <a href="/ui/login" style="color:var(--accent);font-size:.875rem;">Go to login →</a>
    </div>

    <!-- Setup form -->
    <form x-show="!alreadySetup && !done" @submit.prevent="createAdmin()">
      <div class="space-y-4">
        <div>
          <label style="display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:.35rem;">Admin username</label>
          <input x-model="username" type="text" required autofocus placeholder="admin" class="w-full" />
        </div>
        <div>
          <label style="display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:.35rem;">Password</label>
          <div class="relative">
            <input x-model="password" :type="showPwd ? 'text' : 'password'" required class="w-full" style="padding-right:2.5rem;" />
            <button type="button" @click="showPwd = !showPwd"
                    style="position:absolute;right:.5rem;top:.4rem;font-size:.75rem;color:var(--text-muted);padding:.15rem .35rem;background:none;border:none;cursor:pointer;">
              <span x-text="showPwd ? 'hide' : 'show'"></span>
            </button>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:.35rem;">Confirm password</label>
          <input x-model="confirm" :type="showPwd ? 'text' : 'password'" required class="w-full" />
        </div>
      </div>

      <div x-show="error" x-cloak
           style="margin-top:.75rem;font-size:.8rem;color:#f09090;background:rgba(224,79,79,.1);border:1px solid rgba(224,79,79,.2);border-radius:.375rem;padding:.5rem .75rem;"
           x-text="error"></div>

      <button type="submit" :disabled="loading"
              style="margin-top:1.25rem;width:100%;background-color:var(--accent);color:#e8f0ff;font-weight:500;padding:.55rem 1rem;border-radius:.375rem;font-size:.875rem;cursor:pointer;"
              :style="loading ? 'opacity:.5;cursor:not-allowed;' : ''">
        <span x-show="!loading">Create admin account</span>
        <span x-show="loading" x-cloak>Creating…</span>
      </button>
    </form>

    <!-- Success state -->
    <div x-show="done" x-cloak style="text-align:center;padding:1rem 0;">
      <div style="font-size:2.5rem;margin-bottom:.75rem;">✅</div>
      <p style="color:var(--text-primary);font-weight:600;margin-bottom:.25rem;">Admin account created!</p>
      <p style="font-size:.8rem;color:var(--text-secondary);margin-bottom:1.25rem;">
        Username: <strong x-text="username"></strong>
      </p>
      <a href="/ui/login"
         style="display:inline-block;background-color:var(--accent);color:#e8f0ff;font-size:.875rem;padding:.5rem 1.5rem;border-radius:.375rem;">
        Go to login →
      </a>
    </div>
  </div>

  <script>
    function setupForm() {
      return {
        username: 'admin',
        password: '',
        confirm: '',
        showPwd: false,
        error: '',
        loading: false,
        done: false,
        alreadySetup: false,
        async init() {
          if (localStorage.getItem('anc_token')) {
            window.location.href = '/ui/secrets';
            return;
          }
          try {
            const res = await fetch('/admin/needs-setup');
            const data = await res.json();
            if (!data.needs_setup) this.alreadySetup = true;
          } catch {}
        },
        async createAdmin() {
          this.error = '';
          if (this.password !== this.confirm) { this.error = 'Passwords do not match.'; return; }
          if (this.password.length < 6) { this.error = 'Password must be at least 6 characters.'; return; }
          this.loading = true;
          try {
            const res = await fetch('/admin/users', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: this.username, password: this.password, groups: ['admins'] }),
            });
            const data = await res.json();
            if (!res.ok) { this.error = data.detail || 'Failed to create user.'; return; }
            this.done = true;
          } catch { this.error = 'Network error — is the server reachable?'; }
          finally { this.loading = false; }
        },
      };
    }
  </script>
</body>
</html>
