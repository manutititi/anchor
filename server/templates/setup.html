<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center"
      x-data="setupForm()" x-init="init()">

  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <div class="flex items-center gap-3 mb-2">
      <span class="text-3xl">⚓</span>
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Anchor Vault</h1>
        <p class="text-sm text-blue-600 font-medium">First-time setup</p>
      </div>
    </div>
    <p class="text-sm text-gray-500 mb-6 mt-3">
      No users exist yet. Create the first admin account to get started.
    </p>

    <!-- Setup already done -->
    <div x-show="alreadySetup" x-cloak class="text-center py-4">
      <p class="text-green-700 font-medium mb-4">✓ Setup already complete.</p>
      <a href="/ui/login" class="text-blue-600 hover:underline text-sm">Go to login →</a>
    </div>

    <!-- Setup form -->
    <form x-show="!alreadySetup && !done" @submit.prevent="createAdmin()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Admin username</label>
          <input x-model="username" type="text" required autofocus
                 placeholder="admin"
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input x-model="password" :type="showPwd ? 'text' : 'password'" required
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
            <button type="button" @click="showPwd = !showPwd"
                    class="absolute right-2 top-2 text-gray-400 hover:text-gray-600 text-xs px-1">
              <span x-text="showPwd ? 'hide' : 'show'"></span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
          <input x-model="confirm" :type="showPwd ? 'text' : 'password'" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div x-show="error" x-cloak
           class="mt-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2"
           x-text="error"></div>

      <button type="submit" :disabled="loading"
              class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded text-sm disabled:opacity-50">
        <span x-show="!loading">Create admin account</span>
        <span x-show="loading" x-cloak>Creating…</span>
      </button>
    </form>

    <!-- Success state -->
    <div x-show="done" x-cloak class="text-center py-4">
      <div class="text-4xl mb-3">✅</div>
      <p class="text-gray-800 font-semibold mb-1">Admin account created!</p>
      <p class="text-sm text-gray-500 mb-5">
        Username: <strong x-text="username"></strong>
      </p>
      <a href="/ui/login"
         class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-sm px-6 py-2 rounded">
        Go to login →
      </a>
    </div>
  </div>

  <script>
    function setupForm() {
      return {
        username: 'admin',
        password: '',
        confirm: '',
        showPwd: false,
        error: '',
        loading: false,
        done: false,
        alreadySetup: false,

        async init() {
          // If already logged in, go to secrets
          if (localStorage.getItem('anc_token')) {
            window.location.href = '/ui/secrets';
            return;
          }
          // Check if setup is still needed
          try {
            const res = await fetch('/admin/needs-setup');
            const data = await res.json();
            if (!data.needs_setup) {
              this.alreadySetup = true;
            }
          } catch { /* server unreachable, let the form show */ }
        },

        async createAdmin() {
          this.error = '';
          if (this.password !== this.confirm) {
            this.error = 'Passwords do not match.';
            return;
          }
          if (this.password.length < 6) {
            this.error = 'Password must be at least 6 characters.';
            return;
          }
          this.loading = true;
          try {
            const res = await fetch('/admin/users', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: this.username,
                password: this.password,
                groups: ['admins'],
              }),
            });
            const data = await res.json();
            if (!res.ok) {
              this.error = data.detail || 'Failed to create user.';
              return;
            }
            this.done = true;
          } catch {
            this.error = 'Network error — is the server reachable?';
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
