version: '3.8'

# Secrets are loaded from .env (auto-generated by start.sh on first run)
# To generate manually:
#   JWT_SECRET:       openssl rand -base64 32
#   VAULT_MASTER_KEY: openssl rand -base64 32

services:
  anc-server:
    build: .
    container_name: anc-server
    ports:
      - "17017:17017"
    volumes:
      - ./anchors:/app/anchors
      - ./code:/app/code
    environment:
      - MONGO_URI=mongodb://ancadmin:ancpass@mongodb:27017/
      - MONGO_DB=anchor
      - JWT_SECRET=${JWT_SECRET}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - LOCAL_AUTH_ENABLED=true
      - LDAP_AUTH_ENABLED=false
      # Uncomment to enable LDAP:
      # - LDAP_AUTH_ENABLED=true
      # - LDAP_SERVER=ldap://ldap:389
      # - LDAP_BASE_DN=dc=anchor,dc=local
      # - LDAP_ADMIN_DN=cn=admin,dc=anchor,dc=local
      # - LDAP_ADMIN_PASSWORD=changeme
    networks:
      - anc     # reaches mongodb
      - anc-wg  # reaches wireguard sidecar at http://wireguard:8000 (internal, no internet)
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17017/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ancadmin
      MONGO_INITDB_ROOT_PASSWORD: ancpass
      MONGO_INITDB_DATABASE: anchor
    networks:
      - anc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:

networks:
  anc:
    external: true
  anc-wg:
    external: true
