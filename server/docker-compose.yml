# =============================================================
# Anchor — single compose with all four services.
# No external Docker networks needed: just run docker compose up.
#
# Port exposure:
#   51820/udp  → WireGuard VPN  (internet-facing, clients connect here)
#   62201/udp  → SPA knock listener (anc-server, same netns as wireguard)
#   17017/tcp  → NOT published  (VPN only: connect first, then http://10.13.13.1:17017)
#   8000/tcp   → NOT published  (internal: anc-server calls localhost:8000)
#   27017/tcp  → NOT published  (internal: anc-server calls mongodb:27017)
#
# Static peers:
#   peer1 → 10.13.13.2  (admin backdoor, managed by linuxserver PEERS=peer1)
#   Dynamic users start at 10.13.13.3+ (vpn_uid_counter seq starts at 1,
#   first $inc gives seq=2, uid=2+1=3).  uid=2 (10.13.13.2) is reserved.
#
# Secrets — copy .env.example → .env and generate:
#   JWT_SECRET:       openssl rand -base64 32
#   VAULT_MASTER_KEY: openssl rand -base64 32
#   WG_API_KEY:       openssl rand -base64 32
# =============================================================
services:

  # ── WireGuard: El "escudo" de red ────────────────────────────────────────
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - SERVERURL=${SERVERURL:-auto}
      - SERVERPORT=${SERVERPORT:-51820}
      - INTERNAL_SUBNET=${INTERNAL_SUBNET:-10.13.13.0}
      # peer1 is the static admin backdoor peer (10.13.13.2).
      # linuxserver generates its config in ./wireguard/config/peer_peer1/.
      # The sidecar protects this IP via WG_PROTECTED_IPS and will never
      # add or remove it. Dynamic users are allocated from 10.13.13.3+.
      - PEERS=${PEERS:-peer1}
    ports:
      - "${SERVERPORT:-51820}:51820/udp"   # WireGuard tunnel (clients connect here)
      - "${KNOCK_PORT:-62201}:62201/udp"   # SPA knock listener (handled by anc-server in same netns)
      # 17017/tcp NOT published: clients must connect via VPN first,
      # then reach http://10.13.13.1:17017 inside the tunnel.
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wg", "show" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Sidecar: Gestión de la VPN ──────────────────────────────────────────
  wg-sidecar:
    build: ./wireguard/sidecar
    container_name: wg-sidecar
    cap_add:
      - NET_ADMIN
    network_mode: "service:wireguard" # Comparte red con WireGuard
    environment:
      # Comma-separated IPs the sidecar must NEVER add or remove.
      # 10.13.13.2 = peer1 (static admin backdoor, managed by linuxserver).
      - WG_PROTECTED_IPS=10.13.13.2
      - WG_API_KEY=${WG_API_KEY}
    depends_on:
      wireguard:
        condition: service_healthy
    restart: unless-stopped

  # ── Anchor Server: Tu App ───────────────────────────────────────────────
  anc-server:
    build: .
    container_name: anc-server
    network_mode: "service:wireguard" # Comparte red con WireGuard
    environment:
      - MONGO_URI=mongodb://${MONGO_USER:-ancadmin}:${MONGO_PASS:-ancpass}@mongodb:27017/${MONGO_DB:-anchor}?authSource=admin
      - MONGO_DB=${MONGO_DB:-anchor}
      - JWT_SECRET=${JWT_SECRET}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - VPN_KNOCK_PORT=${KNOCK_PORT:-62201}
      - SPA_PRIVKEY_B64=${SPA_PRIVKEY_B64}
      # WireGuard integration defaults (seeded into MongoDB on first boot)
      - WG_API_KEY=${WG_API_KEY}
      - WG_SUBNET=${INTERNAL_SUBNET:-10.13.13.0}/24
      - WG_SERVER_ENDPOINT=${SERVERURL:-auto}
      - WG_ROUTES=${ALLOWEDIPS:-0.0.0.0/0}
    depends_on:
      wireguard:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      # Usamos python3 para el check por si no tienes 'curl' instalado
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:17017/health')" ]
      interval: 30s
      start_period: 15s
    restart: unless-stopped

  # ── MongoDB: La base de datos (Aislada) ──────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ancadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-ancpass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-anchor}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend # Solo accesible para los que están en esta red (WireGuard)
    healthcheck:
      # Check mejorado para evitar el error de "unhealthy" inicial
      test: [ "CMD", "mongosh", "--quiet", "127.0.0.1:27017/test", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mongodb_data:


networks:
  backend:
    driver: bridge
